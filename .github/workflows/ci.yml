name: CI

# Every push and pull request: the Python tests on each OS the app ships for, the browser tests
# of the web page, and a syntax check of the Electron scripts. desktop.yml calls this too, so no
# installer is built from a commit that fails it.
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # Tesseract lets the scanned-PDF (OCR) tests run instead of skipping; Ubuntu only, to
      # keep the other runners fast.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - run: python -m pip install -e ".[test]"
      # The browser tests have their own job below.
      - run: python -m pytest -q --ignore=tests/test_web_e2e.py

  web-e2e:
    name: web page in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test,e2e]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_web_e2e.py

  desktop-scripts:
    name: Electron scripts parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      # `node --check` takes one file at a time: later arguments are passed to the script.
      - run: |
          node --check desktop/main.js
          node --check desktop/preload.js
          node --check desktop/scripts/build-engine.mjs
