name: Desktop app

# Push a tag like v0.2.0 to build every installer and attach them to a GitHub Release.
# Run it by hand (Actions tab > Desktop app > Run workflow) to get the installers as artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[test]"
      - run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # The engine is a PyInstaller build, which can't cross-compile: each OS/CPU builds its own.
          - { os: macos-14, args: "--mac dmg --arm64", files: "desktop/release/*.dmg" }
          - { os: macos-15-intel, args: "--mac dmg --x64", files: "desktop/release/*.dmg" }
          - { os: windows-latest, args: "--win nsis --x64", files: "desktop/release/*.exe" }
          - { os: ubuntu-22.04, args: "--linux AppImage --x64", files: "desktop/release/*.AppImage" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      CASEFILE_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build:engine
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: casefile-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
