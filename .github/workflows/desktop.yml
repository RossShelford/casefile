name: Desktop app

# Push a tag like v0.2.0 to build every installer, record build provenance for each, and attach
# them with a SHA256SUMS.txt to a draft GitHub Release (published by hand after a check).
# Run it by hand (Actions tab > Desktop app > Run workflow) to get the installers as artifacts only.
#
# Supply chain: every action is pinned to a full commit SHA (the tag is in the comment; bump both
# together), the engine's Python packages come from the hashed desktop/engine-requirements.txt,
# and only the two jobs at the end, which run no project code, get write or signing permissions.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # The engine is a PyInstaller build, which can't cross-compile: each OS/CPU builds its own.
          # macos-15 is Apple silicon; macos-15-intel is GitHub's last Intel macOS image
          # (supported until macOS 15 is retired in autumn 2027).
          - { os: macos-15, args: "--mac dmg --arm64", files: "desktop/release/*.dmg" }
          - { os: macos-15-intel, args: "--mac dmg --x64", files: "desktop/release/*.dmg" }
          - { os: windows-latest, args: "--win nsis --x64", files: "desktop/release/*.exe" }
          - { os: ubuntu-22.04, args: "--linux AppImage --x64", files: "desktop/release/*.AppImage" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      CASEFILE_PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # No dependency cache in a release build: a cache written by another workflow run could
      # otherwise end up inside the installers.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run build:engine
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: casefile-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  attest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      # Signed provenance for each installer: `gh attestation verify <file> -R RossShelford/casefile`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          draft: true
