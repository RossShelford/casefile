[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "casefile"
# The version lives in casefile/__init__.py (__version__); desktop/package.json must match it
# (tests/test_version.py checks).
dynamic = ["version"]
description = "Turn a folder of long, messy documents into a prioritised, easy-to-read log of events, using a local AI model."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ross Shelford" }]
dependencies = [
    # [crypto] pulls in cryptography: without it every AES-encrypted PDF fails to open,
    # including ones that only lock editing.
    "pypdf[crypto]>=4.0",
    "pypdfium2>=4",
    "openpyxl>=3.1",
    "olefile>=0.46",
    "reportlab>=4.0",
    "svglib>=1.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
# Browser tests of the web page (tests/test_web_e2e.py); also run `playwright install chromium`.
e2e = ["playwright>=1.40"]

[project.scripts]
casefile = "casefile.cli:main"

[project.urls]
Homepage = "https://github.com/RossShelford/casefile"
Issues = "https://github.com/RossShelford/casefile/issues"

[tool.setuptools]
packages = ["casefile"]

[tool.setuptools.dynamic]
version = { attr = "casefile.__version__" }

[tool.setuptools.package-data]
casefile = ["assets/fonts/*", "assets/icons/*", "web/*"]
